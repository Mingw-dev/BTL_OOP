spring.application.name=ilms

# 1. Cấu hình Datasource kết nối MySQL
    spring.datasource.url=jdbc:mysql://localhost:3306/ilmss?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Cấu hình JPA / Hibernate
# Dùng 'update' khi dev để Hibernate tự tạo/sửa bảng theo Entity
spring.jpa.hibernate.ddl-auto=update

# Hiển thị và format SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Tắt cảnh báo spring.jpa.open-in-view:
spring.jpa.open-in-view=false
# 3. Cấu hình Flyway (Tạm tắt nếu chưa viết file migration SQL)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
#Swagger
springdoc.swagger-ui.with-credentials=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

