# 2. Cấu hình JPA / Hibernate
# Dùng 'update' khi dev để Hibernate tự tạo/sửa bảng theo Entity
# Bật Flyway tự động chạy migration khi khởi động app
spring.flyway.enabled=true
# Tắt Hibernate ddl-auto để tránh xung đột với Flyway
spring.jpa.hibernate.ddl-auto=none
# Tự động sửa lại checksum trong DB khi phát hiện file migration bị thay đổi
spring.flyway.repair=true
# Bỏ qua bước kiểm tra nghiêm ngặt về checksum và trạng thái file
spring.flyway.validate-on-migrate=false
# Cho phép chạy các migration có version thấp hơn version hiện tại đã chạy (nếu có bổ sung file cũ)
spring.flyway.out-of-order=true

# Hiển thị và format SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Tắt cảnh báo spring.jpa.open-in-view:
spring.jpa.open-in-view=false
# 3. Cấu hình Flyway (Tạm tắt nếu chưa viết file migration SQL)

spring.flyway.baseline-on-migrate=false
